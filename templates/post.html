{% extends "base.html" %}
{% block title %}{{ post.title }} · {{ site.title }}{% endblock %}
{% block meta %}{% if post.description %}<meta name="description" content="{{ post.description }}">{% endif %}{% endblock %}
{% block content %}
<article>
  <p><time datetime="{{ post.date.isoformat() }}">{{ post.date.strftime('%Y-%m-%d') }}</time></p>
  <h1>{{ post.title }}</h1>
{{ post.html }}
  <footer><a href="mailto:{{ site.reply_email }}?subject={{ post.title | urlencode }}">Reply by email</a></footer>
</article>
{% endblock %}
